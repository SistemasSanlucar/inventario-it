<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presencia IT — SanLucar</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<style>
:root {
  --bg:       #0D1117;
  --surface:  #161B22;
  --elevated: #21262D;
  --border:   #30363D;
  --text:     #E6EDF3;
  --muted:    #7D8590;
  --accent:   #E8A838;
  --st-oficina:    #3FB950;
  --st-remoto:     #58A6FF;
  --st-vacaciones: #E8A838;
  --st-viaje:      #BC8CFF;
  --st-baja:       #F85149;
  --st-maternidad: #FF7EB3;
  --st-agro:       #2D333B;
  --st-libre:      #30363D;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Space Grotesk', sans-serif; min-height: 100vh; }
body::before {
  content: ''; position: fixed; inset: 0;
  background-image: linear-gradient(rgba(232,168,56,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(232,168,56,0.04) 1px, transparent 1px);
  background-size: 48px 48px; pointer-events: none; z-index: 0;
}

/* LOGIN */
#login-screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; z-index: 10; }
.login-logo { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.login-logo .mark { width: 72px; height: 72px; border-radius: 18px; background: var(--surface); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 32px; }
.login-logo h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; }
.login-logo h1 span { color: var(--accent); }
.login-logo p { font-size: 0.8rem; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
.btn-login { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border); color: var(--text); font-family: 'Space Grotesk', sans-serif; font-size: 0.95rem; font-weight: 500; padding: 14px 32px; border-radius: 8px; cursor: pointer; transition: all 0.15s; }
.btn-login:hover { border-color: var(--accent); background: rgba(232,168,56,0.08); }

/* APP */
#app { display: none; position: relative; z-index: 1; min-height: 100vh; }

/* HEADER */
header { display: flex; align-items: center; justify-content: space-between; padding: 16px 40px; border-bottom: 1px solid var(--border); background: rgba(13,17,23,0.9); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 5; gap: 20px; }
.header-left { display: flex; flex-direction: column; gap: 3px; flex-shrink: 0; }
.header-left h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.01em; }
.header-left h1 span { color: var(--accent); }
.header-center { display: flex; align-items: center; gap: 10px; }
.date-nav-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text); width: 32px; height: 32px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1rem; transition: all 0.15s; flex-shrink: 0; }
.date-nav-btn:hover { border-color: var(--accent); color: var(--accent); }
.date-input-wrap { position: relative; }
#date-picker { background: var(--surface); border: 1px solid var(--border); color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; padding: 7px 12px; border-radius: 6px; cursor: pointer; letter-spacing: 0.04em; outline: none; }
#date-picker:focus { border-color: var(--accent); }
.today-btn { background: none; border: 1px solid var(--border); color: var(--muted); font-family: 'Space Grotesk', sans-serif; font-size: 0.7rem; padding: 6px 12px; border-radius: 6px; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
.today-btn:hover { border-color: var(--accent); color: var(--accent); }
.weekend-badge { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--muted); background: var(--surface); border: 1px solid var(--border); padding: 5px 10px; border-radius: 6px; }
.header-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.user-info { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; color: var(--muted); }
.user-avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--elevated); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 0.62rem; font-weight: 700; color: var(--accent); }
.btn-sm { background: none; border: 1px solid var(--border); color: var(--muted); font-family: 'Space Grotesk', sans-serif; font-size: 0.7rem; padding: 5px 12px; border-radius: 6px; cursor: pointer; transition: all 0.15s; }
.btn-sm:hover { border-color: var(--text); color: var(--text); }

/* STATS */
.stats-bar { display: flex; gap: 1px; padding: 24px 40px 0; }
.stat-pill { flex: 1; display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--border); padding: 12px 20px; }
.stat-pill:first-child { border-radius: 8px 0 0 8px; }
.stat-pill:last-child  { border-radius: 0 8px 8px 0; }
.stat-pip { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.stat-val { font-size: 1.5rem; font-weight: 700; line-height: 1; }
.stat-lbl { font-size: 0.6rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; margin-top: 2px; }

/* MAP */
.map-section { padding: 40px; display: flex; flex-direction: column; align-items: center; flex: 1; }
.map-title { font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin-bottom: 28px; display: flex; align-items: center; gap: 10px; width: 100%; }
.map-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.map-canvas { display: flex; flex-direction: column; align-items: center; gap: 80px; width: 100%; }

/* ISLANDS */
.island { display: flex; flex-direction: column; align-items: center; }
.island-tag { font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 12px; align-self: flex-start; }
.island-1-inner { display: flex; flex-direction: column; }
.island-2-inner { display: flex; flex-direction: row; align-items: stretch; }
.desk-col { display: flex; flex-direction: column; gap: 14px; }
.desk-row { display: flex; gap: 14px; }
.gap-h { height: 28px; width: 100%; display: flex; align-items: center; justify-content: center; }
.gap-h::before { content: ''; width: 90%; height: 1px; background: linear-gradient(90deg, transparent, var(--border) 20%, var(--border) 80%, transparent); }
.gap-v { width: 28px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.gap-v::before { content: ''; height: 80%; width: 1px; background: linear-gradient(180deg, transparent, var(--border) 20%, var(--border) 80%, transparent); }

/* DESK CARD */
.desk { width: 160px; background: var(--elevated); border: 1.5px solid var(--border); border-radius: 14px; padding: 16px 14px 14px; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s; position: relative; overflow: hidden; }
.desk::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; border-radius: 12px 12px 0 0; background: var(--desk-color, var(--st-libre)); transition: background 0.2s; }
.desk:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(0,0,0,0.5); border-color: var(--desk-color, var(--border)); }
.desk.is-oficina::after { content: ''; position: absolute; top: 12px; right: 12px; width: 8px; height: 8px; border-radius: 50%; background: var(--st-oficina); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(1.5)} }
.desk.is-agro  { opacity: 0.3; cursor: default; pointer-events: none; }
.desk.is-vacio { opacity: 0.15; cursor: default; pointer-events: none; border-style: dashed; }
.desk-cab { width: 160px; margin-left: 14px; align-self: stretch; }
.desk-num { font-family: 'JetBrains Mono', monospace; font-size: 0.62rem; color: var(--muted); letter-spacing: 0.08em; margin-bottom: 11px; }
.desk-avatar { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; font-weight: 700; margin-bottom: 11px; background: rgba(255,255,255,0.05); flex-shrink: 0; }
.desk-name { font-size: 0.78rem; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.desk-status-row { display: flex; align-items: center; gap: 6px; margin-top: 9px; }
.desk-pip { width: 7px; height: 7px; border-radius: 50%; background: var(--desk-color, var(--st-libre)); flex-shrink: 0; }
.desk-status-lbl { font-size: 0.62rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* LEGEND */
.legend { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; margin: 0 40px; padding: 20px 0 40px; border-top: 1px solid var(--border); }
.leg-item { display: flex; align-items: center; gap: 7px; font-size: 0.7rem; color: var(--muted); }
.leg-dot { width: 9px; height: 9px; border-radius: 50%; }

/* STATE MSG */
.state-msg { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; min-height: 320px; color: var(--muted); font-size: 0.85rem; }
.spinner { width: 36px; height: 36px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* TOOLTIP */
.tooltip { display: none; position: fixed; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; min-width: 190px; z-index: 50; pointer-events: none; box-shadow: 0 16px 40px rgba(0,0,0,0.6); }
.tooltip.show { display: block; }
.tooltip-name { font-weight: 600; font-size: 0.9rem; margin-bottom: 3px; }
.tooltip-desk { font-family: 'JetBrains Mono', monospace; font-size: 0.58rem; color: var(--muted); margin-bottom: 12px; }
.tooltip-badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }

/* WEEKEND OVERLAY */
.weekend-msg { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 60px 0; color: var(--muted); }
.weekend-msg .icon { font-size: 3rem; opacity: 0.4; }
.weekend-msg p { font-size: 0.9rem; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-logo">
    <div class="mark">🍊</div>
    <h1>Presencia <span>IT</span></h1>
    <p>SanLucar Fruit · Sistemas &amp; Infraestructura</p>
  </div>
  <button class="btn-login" id="btn-login">
    <svg width="18" height="18" viewBox="0 0 21 21" fill="none">
      <path d="M10 0H0v10h10V0z" fill="#F25022"/>
      <path d="M21 0H11v10h10V0z" fill="#7FBA00"/>

<div id="app">

  <div class="stats-bar">

<div class="tooltip" id="tooltip">

<script>
// ══════════════════════════════════════════════════
//  CONFIG
// ══════════════════════════════════════════════════
const CFG = {
  clientId:  "80ba264e-e1fc-4749-bf00-2c25b93b4ee5",
  tenantId:  "f37778d8-59b2-4e5e-a56b-08eb8ad3c13a",
  sitePath:  "sanlucarfruit.sharepoint.com:/sites/InformationSystems:",
  filePath:  "07. IT Organization/26 Calendario Presencia y Vacaciones 2026.xlsm",
  tableName: "TablaPresencia",
  sheet2026: "2026",
  // Fecha de inicio del calendario (lunes de la semana 1)
  calStart:  new Date(2025, 11, 29), // 29 dic 2025
  // Columna (1-indexed) de la primera fecha (H = 8)
  firstCol:  8,
  // Columnas por semana
  colsPerWeek: 9,
};

// ══════════════════════════════════════════════════
//  LAYOUT FÍSICO
// ══════════════════════════════════════════════════
const LAYOUT = {
  isla1: { top: [8,7,6,5], bottom: [1,2,3,4] },
  isla2: { leftCol: [12,9], rightCol: [11,10], cabecera: 13 },
};
const AGRO_DESKS  = new Set([7, 8]);
const EMPTY_DESKS = new Set([13]);

// ══════════════════════════════════════════════════
//  ESTADOS
// ══════════════════════════════════════════════════
const ESTADOS = {
  "P":   { label: "En oficina",   color: "var(--st-oficina)",    cls: "is-oficina"    },
  "R":   { label: "Teletrabajo",  color: "var(--st-remoto)",     cls: "is-remoto"     },
  "V":   { label: "Viaje",        color: "var(--st-viaje)",      cls: "is-viaje"      },
  "1":   { label: "Vacaciones",   color: "var(--st-vacaciones)", cls: "is-vacaciones" },
  "0.5": { label: "Medio día",    color: "var(--st-vacaciones)", cls: "is-vacaciones" },
  "BA":  { label: "Baja",         color: "var(--st-baja)",       cls: "is-baja"       },
  "MA":  { label: "Maternidad",   color: "var(--st-maternidad)", cls: "is-maternidad" },
};
const ESTADO_DEFAULT = { label: "Sin definir", color: "var(--st-libre)", cls: "is-libre" };

function parseEstado(val) {
  if (val === null || val === undefined || val === "" || val === 0) return ESTADO_DEFAULT;
  return ESTADOS[String(val).trim().toUpperCase()] || ESTADOS[String(val).trim()] || ESTADO_DEFAULT;
}

// ══════════════════════════════════════════════════
//  FECHA UTILS
// ══════════════════════════════════════════════════
function toYMD(d) {
  return d.toISOString().slice(0, 10);
}
function fromYMD(s) {
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d);
}
function isWeekend(d) {
  const day = d.getDay(); // 0=Sun, 6=Sat
  return day === 0 || day === 6;
}
function prevWorkday(d) {
  const r = new Date(d); r.setDate(r.getDate() - 1);
  while (isWeekend(r)) r.setDate(r.getDate() - 1);
  return r;
}
function nextWorkday(d) {
  const r = new Date(d); r.setDate(r.getDate() + 1);
  while (isWeekend(r)) r.setDate(r.getDate() + 1);
  return r;
}

// Convierte número de columna (1-indexed) a letra Excel (A, B, ..., AA, ...)
function colToLetter(n) {
  let s = '';
  while (n > 0) { n--; s = String.fromCharCode(65 + n % 26) + s; n = Math.floor(n / 26); }
  return s;
}

// Dada una fecha, devuelve la letra de columna en la hoja 2026 (o null si fuera de rango)
function getColForDate(date) {
  const start = new Date(CFG.calStart);
  start.setHours(0,0,0,0);
  const target = new Date(date);
  target.setHours(0,0,0,0);
  const days = Math.round((target - start) / 86400000);
  if (days < 0 || days > 365) return null;
  const weekNum  = Math.floor(days / 7);
  const dayOfWeek = days % 7;  // 0=lun, 6=dom
  if (dayOfWeek >= 5) return null; // finde
  const colIdx1 = CFG.firstCol + weekNum * CFG.colsPerWeek + dayOfWeek;
  return colToLetter(colIdx1);
}

// ══════════════════════════════════════════════════
//  ESTADO GLOBAL
// ══════════════════════════════════════════════════
let currentDate = new Date();
currentDate.setHours(0,0,0,0);
if (isWeekend(currentDate)) currentDate = prevWorkday(currentDate);

let cachedSiteId = null;
let personTable  = []; // [{nombre, puesto, iniciales, fila}]

// ══════════════════════════════════════════════════
//  MSAL
// ══════════════════════════════════════════════════
const msalApp = new msal.PublicClientApplication({
  auth: {
    clientId: CFG.clientId,
    authority: `https://login.microsoftonline.com/${CFG.tenantId}`,
    redirectUri: window.location.href.split('?')[0].split('#')[0],
  },
  cache: { cacheLocation: "localStorage" },
});
const SCOPES = ["https://graph.microsoft.com/Sites.ReadWrite.All", "https://graph.microsoft.com/User.Read"];

async function getToken() {
  const accounts = msalApp.getAllAccounts();
  if (!accounts.length) throw new Error("No hay sesión");
  try {
    const r = await msalApp.acquireTokenSilent({ scopes: SCOPES, account: accounts[0] });
    return r.accessToken;
  } catch {
    await msalApp.acquireTokenRedirect({ scopes: SCOPES });
    return null;
  }
}

async function login()  { await msalApp.loginRedirect({ scopes: SCOPES }); }
async function logout() { await msalApp.logoutRedirect({ postLogoutRedirectUri: window.location.href }); }

// ══════════════════════════════════════════════════
//  GRAPH API
// ══════════════════════════════════════════════════
async function getSiteId(token) {
  if (cachedSiteId) return cachedSiteId;
  const r = await fetch(`https://graph.microsoft.com/v1.0/sites/${CFG.sitePath}`, { headers: { Authorization: `Bearer ${token}` } });
  if (!r.ok) throw new Error(`Site error ${r.status}`);
  const d = await r.json();
  cachedSiteId = d.id;
  return cachedSiteId;
}

async function fetchPersonTable(token) {
  const siteId = await getSiteId(token);
  const r = await fetch(
    `https://graph.microsoft.com/v1.0/sites/${siteId}/drive/root:/${encodeURIComponent(CFG.filePath)}:/workbook/tables/${CFG.tableName}/rows`,
    { headers: { Authorization: `Bearer ${token}` } }
  );
  if (!r.ok) throw new Error(`Tabla error ${r.status}`);
  const d = await r.json();
  // Columnas: [Nombre(0), Estado(1), Puesto(2), Iniciales(3), Fila(4)]
  return d.value.map(row => {
    const [nombre, , puesto, iniciales, fila] = row.values[0];
    return { nombre: String(nombre||'').trim(), puesto: Number(puesto), iniciales: String(iniciales||'??').trim(), fila: Number(fila) };
  }).filter(p => p.nombre && p.puesto && p.fila);
}

async function fetchStatusForDate(token, date) {
  const col = getColForDate(date);
  if (!col) return {};

  const siteId = await getSiteId(token);
  const rows = personTable.map(p => p.fila);
  if (!rows.length) return {};

  const minRow = Math.min(...rows);
  const maxRow = Math.max(...rows);
  const addr   = `${col}${minRow}:${col}${maxRow}`;

  const r = await fetch(
    `https://graph.microsoft.com/v1.0/sites/${siteId}/drive/root:/${encodeURIComponent(CFG.filePath)}:/workbook/worksheets/${encodeURIComponent(CFG.sheet2026)}/range(address='${addr}')`,
    { headers: { Authorization: `Bearer ${token}` } }
  );
  if (!r.ok) throw new Error(`Sheet error ${r.status}`);
  const d = await r.json();

  // d.values: array de [valor] por cada fila en el rango
  const result = {};
  d.values.forEach((cell, idx) => {
    const rowNum = minRow + idx;
    const person = personTable.find(p => p.fila === rowNum);
    if (person) result[person.puesto] = cell[0];
  });
  return result;
}

// ══════════════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════════════
function deskCard(num, statusMap) {
  const id = `P${String(num).padStart(2,'0')}`;

  if (EMPTY_DESKS.has(num)) {
    return `<div class="desk is-vacio" style="--desk-color:var(--st-libre)"><div class="desk-num">${id}</div></div>`;
  }
  if (AGRO_DESKS.has(num)) {
    return `<div class="desk is-agro" style="--desk-color:var(--st-agro)">
      <div class="desk-num">${id}</div>
      <div class="desk-avatar" style="background:rgba(255,255,255,0.03);color:var(--muted)">–</div>
      <div class="desk-name" style="color:var(--muted)">Agro</div>
      <div class="desk-status-row"><div class="desk-pip" style="background:var(--st-agro)"></div><div class="desk-status-lbl">fuera de alcance</div></div>
    </div>`;
  }

  const person = personTable.find(p => p.puesto === num);
  if (!person) {
    return `<div class="desk is-vacio" style="--desk-color:var(--st-libre)">
      <div class="desk-num">${id}</div>
      <div class="desk-avatar" style="background:rgba(255,255,255,0.03);color:var(--muted)">?</div>
      <div class="desk-name" style="color:var(--muted)">Sin datos</div>
    </div>`;
  }

  const rawVal = statusMap[num];
  const est    = parseEstado(rawVal);

  return `<div class="desk ${est.cls}"
      style="--desk-color:${est.color}"
      data-num="${num}" data-nombre="${person.nombre}" data-estado="${est.label}"
      onmouseenter="showTip(event,this)" onmouseleave="hideTip()">
    <div class="desk-num">${id}</div>
    <div class="desk-avatar" style="background:${est.color}22;color:${est.color}">${person.iniciales}</div>
    <div class="desk-name">${person.nombre}</div>
    <div class="desk-status-row">
      <div class="desk-pip"></div>
      <div class="desk-status-lbl">${est.label}</div>
    </div>
  </div>`;
}

function renderMap(statusMap) {
  const L = LAYOUT;
  const html = `<div class="map-canvas">
    <div class="island" style="align-items:center">
      <div class="island-tag">Isla 2</div>
      <div class="island-2-inner">
        <div class="desk-col">${deskCard(L.isla2.leftCol[0],statusMap)}${deskCard(L.isla2.leftCol[1],statusMap)}</div>
        <div class="gap-v"></div>
        <div class="desk-col">${deskCard(L.isla2.rightCol[0],statusMap)}${deskCard(L.isla2.rightCol[1],statusMap)}</div>
        <div class="desk-cab">${deskCard(L.isla2.cabecera,statusMap)}</div>
      </div>
    </div>
    <div class="island" style="align-items:center">
      <div class="island-tag">Isla 1</div>
      <div class="island-1-inner">
        <div class="desk-row">${L.isla1.top.map(n=>deskCard(n,statusMap)).join('')}</div>
        <div class="gap-h"></div>
        <div class="desk-row">${L.isla1.bottom.map(n=>deskCard(n,statusMap)).join('')}</div>
      </div>
    </div>
  </div>`;
  document.getElementById('map-body').innerHTML = html;

  // Stats
  const counts = { 'is-oficina':0, 'is-remoto':0, 'is-vacaciones':0, 'is-viaje':0, other:0 };
  personTable.forEach(p => {
    const est = parseEstado(statusMap[p.puesto]);
    if (counts[est.cls] !== undefined) counts[est.cls]++;
    else counts.other++;
  });
  document.getElementById('cnt-oficina').textContent    = counts['is-oficina'];
  document.getElementById('cnt-remoto').textContent     = counts['is-remoto'];
  document.getElementById('cnt-vacaciones').textContent = counts['is-vacaciones'];
  document.getElementById('cnt-viaje').textContent      = counts['is-viaje'];
  document.getElementById('cnt-libre').textContent      = counts.other;
}

function showWeekend() {
  document.getElementById('map-body').innerHTML = `
    <div class="weekend-msg">
      <div class="icon">🌴</div>
      <p>Fin de semana — no hay datos de presencia</p>
    </div>`;
  ['cnt-oficina','cnt-remoto','cnt-vacaciones','cnt-viaje','cnt-libre'].forEach(id => document.getElementById(id).textContent = '–');
}

// ══════════════════════════════════════════════════
//  TOOLTIP
// ══════════════════════════════════════════════════
function showTip(ev, el) {
  const tip = document.getElementById('tooltip');
  document.getElementById('tt-name').textContent = el.dataset.nombre;
  document.getElementById('tt-desk').textContent = `Puesto P${String(el.dataset.num).padStart(2,'0')}`;
  const badge = document.getElementById('tt-badge');
  const color = getComputedStyle(el).getPropertyValue('--desk-color').trim();
  badge.textContent = el.dataset.estado;
  badge.style.cssText = `background:${color}22;color:${color};border:1px solid ${color}55`;
  const r = el.getBoundingClientRect();
  tip.style.left = (r.right + 12) + 'px';
  tip.style.top  = r.top + 'px';
  tip.classList.add('show');
}
function hideTip() { document.getElementById('tooltip').classList.remove('show'); }

// ══════════════════════════════════════════════════
//  DATE PICKER
// ══════════════════════════════════════════════════
function updateDatePicker() {
  document.getElementById('date-picker').value = toYMD(currentDate);
}

async function loadForDate(date) {
  currentDate = new Date(date);
  currentDate.setHours(0,0,0,0);
  updateDatePicker();

  if (isWeekend(currentDate)) { showWeekend(); return; }

  document.getElementById('map-body').innerHTML = '<div class="state-msg"><div class="spinner"></div><span>Cargando…</span></div>';
  try {
    const token = await getToken();
    if (!token) return;
    const statusMap = await fetchStatusForDate(token, currentDate);
    renderMap(statusMap);
  } catch(err) {
    document.getElementById('map-body').innerHTML = `<div class="state-msg">⚠️ ${err.message}<br><button class="btn-sm" onclick="loadForDate(currentDate)" style="margin-top:12px">Reintentar</button></div>`;
    console.error(err);
  }
}

// ══════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════
async function initApp() {
  const accounts = msalApp.getAllAccounts();
  if (!accounts.length) return;

  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';

  const acc = accounts[0];
  const parts = (acc.name || acc.username || '').split(' ');
  document.getElementById('user-ini').textContent  = parts.map(p=>p[0]).join('').substring(0,2).toUpperCase() || '?';
  document.getElementById('user-name').textContent = acc.name || acc.username;

  updateDatePicker();

  try {
    const token = await getToken();
    if (!token) return;
    personTable = await fetchPersonTable(token);
    await loadForDate(currentDate);
  } catch(err) {
    document.getElementById('map-body').innerHTML = `<div class="state-msg">⚠️ ${err.message}</div>`;
    console.error(err);
  }
}

// ══════════════════════════════════════════════════
//  EVENTOS
// ══════════════════════════════════════════════════
document.getElementById('btn-login').addEventListener('click', login);
document.getElementById('btn-logout').addEventListener('click', logout);
document.getElementById('btn-refresh').addEventListener('click', () => loadForDate(currentDate));
document.getElementById('btn-today').addEventListener('click', () => { const t=new Date(); t.setHours(0,0,0,0); loadForDate(t); });
document.getElementById('btn-prev').addEventListener('click', () => loadForDate(prevWorkday(currentDate)));
document.getElementById('btn-next').addEventListener('click', () => loadForDate(nextWorkday(currentDate)));
document.getElementById('date-picker').addEventListener('change', e => loadForDate(fromYMD(e.target.value)));

msalApp.handleRedirectPromise().then(initApp).catch(err => console.error('Redirect error:', err));
</script>
